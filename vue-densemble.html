     definitions:[
       ['Aux prix courants','La valeur telle qu\u2019elle a \u00e9t\u00e9 pay\u00e9e cette ann\u00e9e-l\u00e0. Elle m\u00e9lange deux mouvements : on a produit plus, et les prix ont mont\u00e9. C\u2019est le chiffre qui sert \u00e0 rapporter une grandeur \u00e0 une autre de la m\u00eame ann\u00e9e \u2014 la dette rapport\u00e9e au PIB, par exemple.'],
