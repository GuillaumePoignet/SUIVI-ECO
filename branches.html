    {type:'texte',titre:'D\u00e9finitions : production, valeur ajout\u00e9e, marge',
     chapeau:'Cinq mots reviennent partout sur cette page. Ils ont un sens pr\u00e9cis en comptabilit\u00e9 nationale, souvent diff\u00e9rent du sens courant.',
     definitions:[
       ['Branche, ou secteur','Un regroupement d\u2019activit\u00e9s qui produisent la m\u00eame chose : l\u2019agriculture, la construction, les transports. Une entreprise peut relever de plusieurs branches si elle exerce plusieurs m\u00e9tiers. Le d\u00e9coupage existe en 17, 38 ou 88 postes selon la finesse voulue.'],
       ['Production','La valeur totale de ce qui a \u00e9t\u00e9 fabriqu\u00e9 ou fourni dans l\u2019ann\u00e9e, avant d\u00e9duction de quoi que ce soit. Elle compte donc plusieurs fois la m\u00eame mati\u00e8re quand elle traverse plusieurs secteurs : le bl\u00e9, puis la farine, puis le pain.'],

       ['Exc\u00e9dent brut d\u2019exploitation','Ce qui reste de la valeur ajout\u00e9e une fois pay\u00e9s les salaires, les cotisations et les IMP\u00d4TS SUR LA PRODUCTION \u2014 ceux qu\u2019on doit qu\u2019on gagne de l\u2019argent ou non : taxe fonci\u00e8re, cotisation fonci\u00e8re, versement mobilit\u00e9. Il reste en revanche \u00e0 en tirer l\u2019imp\u00f4t sur les b\u00e9n\u00e9fices, les int\u00e9r\u00eats, les dividendes et le remplacement des machines : le mot \u00ab brut \u00bb dit justement que l\u2019amortissement n\u2019est pas d\u00e9duit. Pour les ind\u00e9pendants, il se m\u00eale au revenu de leur travail : la comptabilit\u00e9 nationale ne sait pas les s\u00e9parer et parle alors de revenu mixte.'],
       ['Valeur ajout\u00e9e et produit int\u00e9rieur brut','Ils ne sont pas \u00e9gaux, et l\u2019\u00e9cart n\u2019est pas une erreur. La somme des valeurs ajout\u00e9es de toutes les branches valait 2 624,9 milliards d\u2019euros en 2024, le PIB 2 935,2 : il manque 310,3 milliards, soit les IMP\u00d4TS SUR LES PRODUITS nets des subventions \u2014 328,8 milliards de TVA, taxes sur les carburants, droits de douane et accises, moins 18,4 milliards de subventions. Le PIB les compte parce qu\u2019il mesure ce que les acheteurs paient ; la valeur ajout\u00e9e ne les compte pas parce qu\u2019elle mesure ce que les producteurs re\u00e7oivent. Ces imp\u00f4ts p\u00e8sent 10,6 % du PIB, et le contr\u00f4le ferme \u00e0 l\u2019euro.'],
